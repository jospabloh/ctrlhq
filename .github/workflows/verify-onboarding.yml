name: Verify onboarding end-to-end

# Exercises the REAL onboarding write path against the live Base44 app:
# register -> verify OTP -> POST complete-onboarding -> read back the user.
#
# Why a workflow and not a local script: outbound HTTPS from the dev/AI
# sandboxes is proxied to an allowlist that excludes base44.app (confirmed by
# direct curl, by Playwright, and from inside the Base44 app sandbox — all
# rejected). A GitHub runner is the only environment in this project's reach
# that can actually talk to the app, so the check runs here and its result is
# read back through the Actions API. Same rationale as smoke.yml.
#
# Two-phase by necessity: registration emails a one-time code, so the run is
# split around fetching it. Phase 1 registers, phase 2 takes the code and
# drives the rest.
#
# This is the regression test for the "empty-bodied HTTP 500 on Crear negocio"
# incident — see base44/entities/User.jsonc's header comment for the root
# cause. If onboarding ever breaks the same way again, phase 2 fails loudly
# with the real status and body instead of a masked generic message.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "register / onboard = the single-tenant path; multitenant = two businesses, switching, and the non-member refusal; reset-request/purge = retire a leftover test account"
        required: true
        type: choice
        options: [register, onboard, reset-request, purge, multitenant]
      reset_token:
        description: "Token from the password-reset email (phase=purge only)"
        required: false
      email:
        description: "Test account address (use a +alias so it lands in a real inbox)"
        required: true
      otp:
        description: "One-time code from the registration email (phase=onboard only)"
        required: false
      business_name:
        description: "Business name to create (phase=onboard only)"
        required: false
        default: "E2E Verification"
      cleanup:
        description: "Delete the business this run creates once the assertion passes (phase=onboard only)"
        required: false
        default: "true"

env:
  APP_ID: 6a7b5d0edb6b035ccae558f3
  API: https://base44.app/api

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Register (phase 1)
        if: inputs.phase == 'register'
        run: |
          set -euo pipefail
          # Throwaway credential: never printed, never reused — verify-otp
          # returns the access token, so nothing downstream needs it.
          PW="$(openssl rand -base64 24)"
          code=$(curl -sS -o /tmp/reg.json -w '%{http_code}' \
            -X POST "$API/apps/$APP_ID/auth/register" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "${{ inputs.email }}" --arg p "$PW" '{email:$e,password:$p}')")
          echo "register -> HTTP $code"
          echo "body: $(cat /tmp/reg.json)"
          test "$code" -lt 400 || { echo "::error::registration failed"; exit 1; }
          echo "::notice::OTP sent to ${{ inputs.email }} — re-run with phase=onboard and the code."

      - name: Verify OTP, run onboarding, read back the user (phase 2)
        if: inputs.phase == 'onboard'
        run: |
          set -euo pipefail
          test -n "${{ inputs.otp }}" || { echo "::error::otp input is required for phase=onboard"; exit 1; }

          echo "--- verify-otp ---"
          code=$(curl -sS -o /tmp/otp.json -w '%{http_code}' \
            -X POST "$API/apps/$APP_ID/auth/verify-otp" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "${{ inputs.email }}" --arg c "${{ inputs.otp }}" '{email:$e,otp_code:$c}')")
          echo "verify-otp -> HTTP $code"
          test "$code" -lt 400 || { echo "body: $(cat /tmp/otp.json)"; echo "::error::OTP verification failed"; exit 1; }
          TOKEN=$(jq -r '.access_token' /tmp/otp.json)
          test "$TOKEN" != "null" -a -n "$TOKEN" || { echo "::error::no access_token returned"; exit 1; }
          echo "got an access token (len ${#TOKEN})"

          echo "--- state BEFORE onboarding ---"
          curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN" \
            | jq -c '{role, business_id}'

          echo "--- complete-onboarding ---"
          # This is the exact call that returned 500 with an empty body.
          code=$(curl -sS -o /tmp/onb.json -w '%{http_code}' --max-time 120 \
            -X POST "$API/apps/$APP_ID/functions/complete-onboarding" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg n "${{ inputs.business_name }}" '{mode:"create",businessName:$n}')")
          echo "complete-onboarding -> HTTP $code"
          echo "body: $(cat /tmp/onb.json)"
          if [ "$code" -ge 400 ]; then
            if [ ! -s /tmp/onb.json ]; then
              echo "::error::EMPTY BODY — the function never returned. This is the original failure signature."
            fi
            exit 1
          fi

          echo "--- state AFTER onboarding (the actual assertion) ---"
          # This is what the browser sees: AuthContext.checkUserAuth() calls
          # auth.me() on the SAME token issued before onboarding, and App.jsx
          # gates /onboarding on user.business_id. If auth.me() does not
          # reflect the write, the user stays stuck on the onboarding screen
          # even though the database row is correct — so assert on this, not
          # on the entity API.
          curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN" -o /tmp/me.json
          echo "raw entities/User/me body:"; cat /tmp/me.json; echo
          BID=$(jq -r '.business_id // empty' /tmp/me.json)
          ROLE=$(jq -r '.role // empty' /tmp/me.json)
          test -n "$BID" || { echo "::error::business_id is still unset — the browser would stay stuck on /onboarding"; exit 1; }
          test "$ROLE" = "business_admin" || { echo "::error::expected role business_admin, got '$ROLE'"; exit 1; }
          echo "::notice::PASS — onboarding wrote business_id=$BID role=$ROLE"

          if [ "${{ inputs.cleanup }}" != "false" ]; then
            echo "--- cleanup: delete the business this run created ---"
            # Runs against the real danger-zone function (Module 7), so the
            # check leaves no Business rows behind in production and exercises
            # delete-account on the way out. It also clears this user's
            # business_id/role, which is asserted below.
            code=$(curl -sS -o /tmp/del.json -w '%{http_code}' --max-time 120 \
              -X POST "$API/apps/$APP_ID/functions/delete-account" \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg b "$BID" --arg n "${{ inputs.business_name }}" '{businessId:$b,confirmName:$n}')")
            echo "delete-account -> HTTP $code"; echo "body: $(cat /tmp/del.json)"
            if [ "$code" -ge 400 ]; then
              echo "::warning::cleanup failed — business $BID is still there and needs removing by hand"
            else
              curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN" -o /tmp/me2.json
              echo "user after cleanup: $(jq -c '{role, business_id}' /tmp/me2.json)"
              test -z "$(jq -r '.business_id // empty' /tmp/me2.json)" \
                || echo "::warning::business_id survived delete-account"
            fi
          fi

      - name: Request a password reset for a leftover test account
        if: inputs.phase == 'reset-request'
        run: |
          set -euo pipefail
          # Cleanup path for accounts left behind by earlier runs, from before
          # the onboard phase learned to delete after itself. The registration
          # OTP is single-use and the throwaway password is never kept, so a
          # reset is the only way back into one of these accounts.
          code=$(curl -sS -o /tmp/rr.json -w '%{http_code}' \
            -X POST "$API/apps/$APP_ID/auth/reset-password-request" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "${{ inputs.email }}" '{email:$e}')")
          echo "reset-password-request -> HTTP $code"
          echo "body: $(cat /tmp/rr.json)"
          test "$code" -lt 400 || { echo "::error::reset request failed"; exit 1; }
          echo "::notice::reset token mailed to ${{ inputs.email }} — re-run with phase=purge."

      - name: Purge a leftover test account's business
        if: inputs.phase == 'purge'
        run: |
          set -euo pipefail
          test -n "${{ inputs.reset_token }}" || { echo "::error::reset_token is required for phase=purge"; exit 1; }
          RT='${{ inputs.reset_token }}'
          # The reset mail ships a SendGrid click-tracking link rather than a
          # bare code, and the real token only appears after the redirect. Take
          # either form: resolve a URL here, use a raw token as-is.
          case "$RT" in
            http*)
              FINAL=$(curl -sSL -o /dev/null -w '%{url_effective}' "$RT")
              echo "resolved to: ${FINAL%%\?*}?<query hidden>"
              RT=$(printf '%s' "$FINAL" | sed -n 's/.*[?&]token=\([^&]*\).*/\1/p')
              test -n "$RT" || { echo "::error::no token= in the resolved URL"; exit 1; }
              echo "extracted a reset token (len ${#RT})"
              ;;
          esac
          # Password is minted here and used only within this run.
          PW="$(openssl rand -base64 24)"

          code=$(curl -sS -o /tmp/rp.json -w '%{http_code}' \
            -X POST "$API/apps/$APP_ID/auth/reset-password" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg t "$RT" --arg p "$PW" '{reset_token:$t,new_password:$p}')")
          echo "reset-password -> HTTP $code"
          test "$code" -lt 400 || { echo "body: $(cat /tmp/rp.json)"; echo "::error::reset failed"; exit 1; }

          code=$(curl -sS -o /tmp/li.json -w '%{http_code}' \
            -X POST "$API/apps/$APP_ID/auth/login" \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg e "${{ inputs.email }}" --arg p "$PW" '{email:$e,password:$p}')")
          echo "login -> HTTP $code"
          test "$code" -lt 400 || { echo "body: $(cat /tmp/li.json)"; echo "::error::login failed"; exit 1; }
          TOKEN=$(jq -r '.access_token' /tmp/li.json)

          curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN" -o /tmp/me.json
          BID=$(jq -r '.business_id // empty' /tmp/me.json)
          echo "user: $(jq -c '{email, role, business_id}' /tmp/me.json)"
          if [ -z "$BID" ]; then echo "::notice::already has no business — nothing to purge"; exit 0; fi

          code=$(curl -sS -o /tmp/del.json -w '%{http_code}' --max-time 120 \
            -X POST "$API/apps/$APP_ID/functions/delete-account" \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg b "$BID" --arg n "${{ inputs.business_name }}" '{businessId:$b,confirmName:$n}')")
          echo "delete-account -> HTTP $code"; echo "body: $(cat /tmp/del.json)"
          test "$code" -lt 400 || { echo "::error::purge failed"; exit 1; }
          echo "::notice::purged business $BID (${{ inputs.business_name }})"

      - name: Multi-tenant — two businesses, switch between them, and prove a non-member is refused
        if: inputs.phase == 'multitenant'
        run: |
          set -euo pipefail
          # Two ways in, because registration mail is rate-limited once a few
          # test accounts have been created in quick succession: a fresh
          # account's OTP, or a password reset on an account that already
          # exists. Either yields the access token; nothing downstream cares
          # which.
          if [ -n "${{ inputs.reset_token }}" ]; then
            RT='${{ inputs.reset_token }}'
            case "$RT" in
              http*)
                FINAL=$(curl -sSL -o /dev/null -w '%{url_effective}' "$RT")
                RT=$(printf '%s' "$FINAL" | sed -n 's/.*[?&]token=\([^&]*\).*/\1/p')
                test -n "$RT" || { echo "::error::no token= in the resolved URL"; exit 1; }
                ;;
            esac
            PW="$(openssl rand -base64 24)"
            code=$(curl -sS -o /tmp/rp.json -w '%{http_code}' \
              -X POST "$API/apps/$APP_ID/auth/reset-password" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg t "$RT" --arg p "$PW" '{reset_token:$t,new_password:$p}')")
            test "$code" -lt 400 || { cat /tmp/rp.json; echo "::error::reset failed"; exit 1; }
            code=$(curl -sS -o /tmp/otp.json -w '%{http_code}' \
              -X POST "$API/apps/$APP_ID/auth/login" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg e "${{ inputs.email }}" --arg p "$PW" '{email:$e,password:$p}')")
            test "$code" -lt 400 || { cat /tmp/otp.json; echo "::error::login failed"; exit 1; }
          else
            test -n "${{ inputs.otp }}" || { echo "::error::pass either otp or reset_token for phase=multitenant"; exit 1; }
            code=$(curl -sS -o /tmp/otp.json -w '%{http_code}' \
              -X POST "$API/apps/$APP_ID/auth/verify-otp" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg e "${{ inputs.email }}" --arg c "${{ inputs.otp }}" '{email:$e,otp_code:$c}')")
            test "$code" -lt 400 || { cat /tmp/otp.json; echo "::error::OTP verification failed"; exit 1; }
          fi
          TOKEN=$(jq -r '.access_token' /tmp/otp.json)
          test -n "$TOKEN" -a "$TOKEN" != "null" || { echo "::error::no access_token"; exit 1; }

          onboard () {  # $1 = business name -> echoes the new business id
            # Print the status and full body. Swallowing these cost a round
            # trip once already: "id was null" says nothing about why.
            local code
            code=$(curl -sS -o /tmp/onb.json -w '%{http_code}' --max-time 60 \
              -X POST "$API/apps/$APP_ID/functions/complete-onboarding" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg n "$1" '{mode:"create",businessName:$n}')")
            echo "  complete-onboarding($1) -> HTTP $code" >&2
            echo "  body: $(cat /tmp/onb.json)" >&2
            jq -r '.business.id // empty' /tmp/onb.json
          }
          memberships () {
            curl -sS "$API/apps/$APP_ID/entities/Membership?q=$(jq -rn --arg u "$USER_ID" '{user_id:$u}|@uri')" \
              -H "Authorization: Bearer $TOKEN"
          }
          me () { curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN"; }
          switch () {  # $1 = business id -> echoes the HTTP status
            curl -sS -o /tmp/sw.json -w '%{http_code}' --max-time 60 \
              -X POST "$API/apps/$APP_ID/functions/switch-tenant" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg b "$1" '{businessId:$b}')"
          }

          USER_ID=$(curl -sS "$API/apps/$APP_ID/entities/User/me" -H "Authorization: Bearer $TOKEN" | jq -r '.id')
          echo "acting as user $USER_ID"

          echo "--- create two businesses ---"
          A=$(onboard "E2E Tenant A"); echo "A=$A"
          echo "  memberships after A: $(memberships)"
          B=$(onboard "E2E Tenant B"); echo "B=$B"
          echo "  memberships after B: $(memberships)"
          test -n "$A" -a "$A" != "null" -a -n "$B" -a "$B" != "null" \
            || { echo "::error::could not create both businesses"; exit 1; }
          test "$A" != "$B" || { echo "::error::both onboardings returned the same business"; exit 1; }

          echo "--- creating the second one should have left us in it ---"
          me | jq -c '{role, business_id}'
          test "$(me | jq -r '.business_id')" = "$B" \
            || { echo "::error::expected to be in B after creating it"; exit 1; }

          echo "--- switch back to A ---"
          code=$(switch "$A"); echo "switch-tenant(A) -> HTTP $code"; cat /tmp/sw.json; echo
          test "$code" -lt 400 || { echo "::error::switching to a tenant we belong to was refused"; exit 1; }
          AFTER=$(me); echo "$AFTER" | jq -c '{role, business_id}'
          test "$(echo "$AFTER" | jq -r '.business_id')" = "$A" \
            || { echo "::error::switch reported success but business_id did not move"; exit 1; }

          echo "--- SECURITY: a business we are NOT a member of must be refused ---"
          # The orphaned tenant left by the original onboarding incident. This
          # account has no Membership for it, so switch-tenant must say no —
          # if this ever passes, the tenant picker became a way into any tenant
          # whose id you can guess.
          code=$(switch "6a860fa4c538d19adbc17195")
          echo "switch-tenant(non-member) -> HTTP $code"; cat /tmp/sw.json; echo
          test "$code" = "403" || { echo "::error::expected 403 for a non-member, got $code — ISOLATION HOLE"; exit 1; }
          test "$(me | jq -r '.business_id')" = "$A" \
            || { echo "::error::a refused switch still moved business_id"; exit 1; }

          echo "::notice::PASS — two tenants, switch works, non-member refused with 403"

          echo "--- cleanup ---"
          for pair in "$A:E2E Tenant A" "$B:E2E Tenant B"; do
            id="${pair%%:*}"; name="${pair#*:}"
            switch "$id" >/dev/null
            code=$(curl -sS -o /tmp/del.json -w '%{http_code}' --max-time 120 \
              -X POST "$API/apps/$APP_ID/functions/delete-account" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg b "$id" --arg n "$name" '{businessId:$b,confirmName:$n}')")
            echo "delete-account($name) -> HTTP $code"
            [ "$code" -lt 400 ] || echo "::warning::$name ($id) still needs removing by hand"
          done
